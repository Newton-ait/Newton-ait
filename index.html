<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newton-ait | GitHub Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            min-height: 100vh;
            color: #e4e4e7;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 3rem 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 3rem;
            background: linear-gradient(135deg, #fff, #a855f7);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: #a1a1aa;
            font-size: 1.1rem;
        }

        .badges {
            margin: 1.5rem 0;
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            text-decoration: none;
            color: #e4e4e7;
            transition: all 0.2s ease;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .badge:hover {
            background: rgba(168,85,247,0.2);
            border-color: #a855f7;
            transform: translateY(-2px);
        }

        .repo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .repo-card {
            background: rgba(255,255,255,0.03);
            border-radius: 16px;
            padding: 1.5rem;
            border: 1px solid rgba(255,255,255,0.08);
            transition: all 0.2s ease;
        }

        .repo-card:hover {
            transform: translateY(-4px);
            border-color: rgba(168,85,247,0.4);
            background: rgba(255,255,255,0.05);
        }

        .repo-name {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .repo-name a {
            color: #a855f7;
            text-decoration: none;
        }

        .repo-name a:hover {
            text-decoration: underline;
        }

        .repo-desc {
            color: #a1a1aa;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            line-height: 1.5;
        }

        .repo-meta {
            display: flex;
            gap: 1rem;
            font-size: 0.8rem;
            color: #71717a;
        }

        .repo-meta span {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: #a1a1aa;
        }

        .error {
            text-align: center;
            padding: 3rem;
            color: #ef4444;
            background: rgba(239,68,68,0.1);
            border-radius: 16px;
        }

        footer {
            text-align: center;
            padding: 2rem;
            margin-top: 3rem;
            border-top: 1px solid rgba(255,255,255,0.05);
            color: #71717a;
            font-size: 0.8rem;
        }

        @media (max-width: 768px) {
            body { padding: 1rem; }
            h1 { font-size: 2rem; }
            .repo-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Newton-ait</h1>
            <p class="subtitle">Developer • Creator • Open Source Enthusiast</p>
            <div class="badges">
                <a href="https://github.com/Newton-ait" class="badge">
                    <svg height="16" width="16" viewBox="0 0 16 16" fill="currentColor">
                        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
                    </svg>
                    GitHub Profile
                </a>
                <a href="mailto:newton-ait@proton.me" class="badge">
                    <svg height="16" width="16" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
                    </svg>
                    Email
                </a>
            </div>
        </header>

        <h2 style="margin-bottom: 1rem;">📁 GitHub Repositories</h2>
        <div id="repos" class="repo-grid">
            <div class="loading">Loading repositories...</div>
        </div>

        <footer>
            <p>Data fetched directly from GitHub API • <a href="https://github.com/Newton-ait" style="color:#a855f7;">github.com/Newton-ait</a></p>
        </footer>
    </div>

    <script>
        async function fetchRepos() {
            const container = document.getElementById('repos');
            
            try {
                const response = await fetch('https://api.github.com/users/Newton-ait/repos?sort=updated&per_page=20');
                
                if (!response.ok) {
                    throw new Error(`GitHub API error: ${response.status}`);
                }
                
                const repos = await response.json();
                
                if (repos.length === 0) {
                    container.innerHTML = '<div class="error">No repositories found.</div>';
                    return;
                }
                
                container.innerHTML = repos.map(repo => `
                    <div class="repo-card">
                        <div class="repo-name">
                            📦 <a href="${repo.html_url}" target="_blank">${repo.name}</a>
                            ${repo.fork ? '<span style="font-size:0.7rem; background:rgba(255,255,255,0.1); padding:2px 6px; border-radius:12px;">🍴 Fork</span>' : ''}
                        </div>
                        <div class="repo-desc">${repo.description || 'No description provided.'}</div>
                        <div class="repo-meta">
                            <span>⭐ ${repo.stargazers_count}</span>
                            <span>🍴 ${repo.forks_count}</span>
                            <span>🔄 Updated: ${new Date(repo.updated_at).toLocaleDateString()}</span>
                        </div>
                    </div>
                `).join('');
                
            } catch (error) {
                console.error('Error fetching repos:', error);
                container.innerHTML = `<div class="error">⚠️ Failed to load repositories. Make sure your GitHub username is correct.</div>`;
            }
        }
        
        fetchRepos();
    </script>
</body>
</html>
